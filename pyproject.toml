[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-scientific-development"
version = "0.1.0"
description = "MCP bridge that uses JEV as a structured scientific evaluator during ChatGPT research workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Alireza Vafaei Sadr" }]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
jev-mcp = "jev_research.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
